name: macToolKit
options:
  bundleIdPrefix: com.sunilaleti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 5432YAY2UX
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 2
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      # Notarization requires Developer ID + hardened runtime + timestamp.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  macToolKit:
    type: application
    platform: macOS
    sources:
      - path: macToolKit
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilaleti.mactoolkit
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sunil Aleti"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: macToolKit/Info.plist
      properties:
        CFBundleDisplayName: macToolKit
        LSUIElement: true
        NSLocationUsageDescription: Used to compute local sunrise and sunset times for automatic color temperature.
        NSLocationWhenInUseUsageDescription: Used to compute local sunrise and sunset times for automatic color temperature.
        CFBundleURLTypes:
          - CFBundleURLName: com.sunilaleti.mactoolkit
            CFBundleURLSchemes:
              - mactoolkit
    entitlements:
      path: macToolKit/macToolKit.entitlements
      properties:
        com.apple.security.application-groups:
          - 5432YAY2UX.com.sunilaleti.mactoolkit
    dependencies:
      - target: FinderTools
        embed: true
  FinderTools:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderTools
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilaleti.mactoolkit.findertools
    info:
      path: FinderTools/Info.plist
      properties:
        CFBundleDisplayName: macToolKit Finder Tools
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderTools/FinderTools.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - 5432YAY2UX.com.sunilaleti.mactoolkit
schemes:
  macToolKit:
    build:
      targets:
        macToolKit: all
    run:
      config: Debug
