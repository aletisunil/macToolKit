name: macToolKit
options:
  bundleIdPrefix: com.sunilaleti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 5432YAY2UX
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: 6
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      # Notarization requires Developer ID + hardened runtime + timestamp.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  macToolKit:
    type: application
    platform: macOS
    sources:
      - path: macToolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilaleti.mactoolkit
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sunil Aleti"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: macToolKit/Info.plist
      properties:
        CFBundleDisplayName: macToolKit
        # Reference build settings so release.sh's MARKETING_VERSION override
        # takes effect; literals here get baked in at xcodegen time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSLocationUsageDescription: Used to compute local sunrise and sunset times for automatic color temperature.
        NSLocationWhenInUseUsageDescription: Used to compute local sunrise and sunset times for automatic color temperature.
    entitlements:
      path: macToolKit/macToolKit.entitlements
      properties: {}
schemes:
  macToolKit:
    build:
      targets:
        macToolKit: all
    run:
      config: Debug
