name: macToolKit
options:
  bundleIdPrefix: com.sunilaleti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 5432YAY2UX
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: 12
    # Shared container for the Folder Peek settings the app writes and the
    # sandboxed Quick Look extension reads. Team-prefixed, so Developer ID
    # signing needs no provisioning profile. Carries BUNDLE_ID_SUFFIX so a
    # debug build keeps its settings separate from the installed stable one.
    APP_GROUP_ID: 5432YAY2UX.com.sunilaleti.mactoolkit$(BUNDLE_ID_SUFFIX)
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
      # Distinct bundle id + name so the Xcode debug build is a separate app
      # from the installed stable one: separate Accessibility (TCC) entry,
      # separate UserDefaults domain, separate login item. No need to remove
      # and re-add the stable app in Accessibility when developing.
      BUNDLE_ID_SUFFIX: .debug
      APP_DISPLAY_NAME: "macToolKit Debug"
      FOLDER_PEEK_DISPLAY_NAME: "Folder Peek Debug"
    Release:
      # Notarization requires Developer ID + hardened runtime + timestamp.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      BUNDLE_ID_SUFFIX: ""
      APP_DISPLAY_NAME: macToolKit
      FOLDER_PEEK_DISPLAY_NAME: "Folder Peek"
targets:
  macToolKit:
    type: application
    platform: macOS
    sources:
      - path: macToolKit
        excludes:
          - Features/FolderPeek
    dependencies:
      - package: Sparkle
      - target: FolderQuickLookExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilaleti.mactoolkit$(BUNDLE_ID_SUFFIX)
        # Renames the built .app ("macToolKit Debug.app" in Debug). The macOS
        # Accessibility list labels rows by the on-disk bundle filename
        # (PRODUCT_NAME), not by CFBundleDisplayName — so this is what makes
        # the debug build show as a distinct "macToolKit Debug" row.
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        # PRODUCT_NAME varies by config, and the Swift module name follows it
        # unless pinned — `@testable import macToolKit` must resolve in both.
        PRODUCT_MODULE_NAME: macToolKit
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sunil Aleti"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set directly rather than via xcodegen's `entitlements:` key, which
        # regenerates the file from project.yml on every run and would drop
        # anything hand-written here.
        CODE_SIGN_ENTITLEMENTS: macToolKit/macToolKit.entitlements
    info:
      path: macToolKit/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        # Reference build settings so release.sh's MARKETING_VERSION override
        # takes effect; literals here get baked in at xcodegen time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read at runtime so the group id has a single source of truth with
        # the entitlements (see APP_GROUP_ID).
        AppGroupIdentifier: $(APP_GROUP_ID)
        LSUIElement: true
        # Sparkle: appcast.xml is uploaded to each GitHub release; the
        # "latest" redirect keeps this URL stable across versions.
        SUFeedURL: https://github.com/aletisunil/macToolKit/releases/latest/download/appcast.xml
        SUPublicEDKey: 01ho/HbvJdYKuyGpQ87otl3+cVE08YHstINQb0dqnUU=
        # Skip Sparkle's own second-launch consent prompt; the General
        # settings pane exposes the auto-check toggle instead.
        SUEnableAutomaticChecks: true
        NSLocationUsageDescription: Used to compute local sunrise and sunset times for automatic color temperature.
        NSLocationWhenInUseUsageDescription: Used to compute local sunrise and sunset times for automatic color temperature.
  macToolKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macToolKitTests
    dependencies:
      - target: macToolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilaleti.mactoolkit$(BUNDLE_ID_SUFFIX).tests
        # Host-app tests: @testable import needs the app's module, and the
        # app is an LSUIElement so nothing appears on screen during a run.
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_DISPLAY_NAME).app/Contents/MacOS/$(APP_DISPLAY_NAME)
        # The bundle must carry the host app's Team ID or dyld refuses to load
        # it into the host, so it inherits the project-level signing settings.
        GENERATE_INFOPLIST_FILE: YES

  FolderQuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FolderQuickLookExtension
      - path: macToolKit/Features/FolderPeek
      - path: macToolKit/Shared/FolderPeekPreferences.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunilaleti.mactoolkit$(BUNDLE_ID_SUFFIX).FolderQuickLook
        PRODUCT_NAME: Folder Peek
        PRODUCT_MODULE_NAME: FolderQuickLookExtension
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: FolderQuickLookExtension/FolderQuickLookExtension.entitlements
    info:
      path: FolderQuickLookExtension/Info.plist
      properties:
        CFBundleDisplayName: $(FOLDER_PEEK_DISPLAY_NAME)
        CFBundleName: $(FOLDER_PEEK_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes:
              - public.folder
            QLSupportsSearchableItems: false
schemes:
  macToolKit:
    build:
      targets:
        macToolKit: all
        FolderQuickLookExtension: all
        macToolKitTests: [test]
    run:
      config: Debug
      executable: macToolKit
    test:
      config: Debug
      targets:
        - macToolKitTests
