name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: release.sh derives CFBundleVersion from
          # `git rev-list --count HEAD`; a shallow clone would pin it to 1
          # and Sparkle would never see a newer version.
          fetch-depth: 0

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PWD=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials macToolKit \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build, notarize, staple
        env:
          # EdDSA private key that signs the Sparkle update (base64, the
          # generate_keys -x export). Sparkle clients verify against the
          # SUPublicEDKey baked into the app.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          Scripts/release.sh "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (e.g. created manually before the
          # tag build finished) — upload artifacts to it instead of failing.
          # appcast.xml rides along; SUFeedURL fetches it via the
          # releases/latest/download redirect.
          if gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              build/macToolKit.dmg build/macToolKit.zip build/appcast.xml \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              build/macToolKit.dmg build/macToolKit.zip build/appcast.xml \
              --title "macToolKit $GITHUB_REF_NAME" \
              --generate-notes
          fi

  # Bumps Casks/mactoolkit.rb in aletisunil/homebrew-tap after each release.
  # Requires HOMEBREW_TAP_TOKEN (PAT with contents:write on homebrew-tap;
  # the default GITHUB_TOKEN cannot push to a different repo). Without it,
  # this job no-ops.
  update-cask:
    name: Update Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping cask update." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: aletisunil/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump version and sha256
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/macToolKit.dmg"
          curl -fsSL -o macToolKit.dmg "$URL"
          SHA="$(shasum -a 256 macToolKit.dmg | awk '{print $1}')"
          CASK="tap/Casks/mactoolkit.rb"
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK"
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$CASK"
          cd tap
          if git diff --quiet; then
            echo "Cask already current for ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update macToolKit cask to ${VERSION}"
          git push
